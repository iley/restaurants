{% extends "restaurants/base.html" %}

{% block title %}Edit {{ restaurant.name }} — Restaurants{% endblock %}

{% block content %}
<nav class="breadcrumb" aria-label="breadcrumbs">
  <ul>
    <li><a href="{% url 'restaurant_list' city_slug=city.slug %}">{{ city.name }}</a></li>
    <li><a href="{% url 'restaurant_detail' city_slug=city.slug pk=restaurant.pk %}">{{ restaurant.name }}</a></li>
    <li class="is-active"><a aria-current="page">Edit</a></li>
  </ul>
</nav>

<h1 class="title">Edit {{ restaurant.name }}</h1>
{% endblock %}
