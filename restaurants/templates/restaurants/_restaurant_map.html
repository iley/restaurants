{% load static %}

<div id="map" style="height: 70vh; width: 100%; border-radius: 6px; position: relative; overflow: hidden;"></div>

{{ restaurants_data|json_script:"restaurant-data" }}
<script>
(function() {
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const citySlug = "{{ city.slug }}";
    const bbox = [
        [{{ city.bbox_min_lon }}, {{ city.bbox_min_lat }}],
        [{{ city.bbox_max_lon }}, {{ city.bbox_max_lat }}]
    ];
    const restaurants = JSON.parse(document.getElementById("restaurant-data").textContent);

    const map = new maplibregl.Map({
        container: "map",
        style: {
            version: 8,
            glyphs: "{% static 'restaurants/map/fonts' %}/{fontstack}/{range}.pbf",
            sprite: location.origin + "{% static 'restaurants/map/sprites/v4/light' %}",
            sources: {
                protomaps: {
                    type: "vector",
                    url: "pmtiles:///tiles/" + citySlug + ".pmtiles",
                    attribution: "&copy; <a href='https://openstreetmap.org'>OpenStreetMap</a>"
                }
            },
            layers: basemaps.layers("protomaps", basemaps.namedFlavor("light"), {lang: "en"})
        },
        bounds: bbox,
        fitBoundsOptions: {padding: 40}
    });

    function markerColor(rating) {
        if (rating == null) return "#3273dc";   // blue — wishlist (not visited)
        if (rating >= 9) return "#2d9e2d";      // green — highly recommend
        if (rating >= 7) return "#7bc67b";      // light green — recommend
        if (rating >= 5) return "#e6c619";      // yellow — it's OK
        return "#999999";                        // grey — don't recommend
    }

    restaurants.forEach(function(r) {
        // Build popup content via DOM so names/cuisines render as text, not HTML.
        const content = document.createElement("div");
        const link = document.createElement("a");
        link.href = r.url;
        link.textContent = r.name;
        const strong = document.createElement("strong");
        strong.appendChild(link);
        content.appendChild(strong);
        content.appendChild(document.createElement("br"));
        content.appendChild(document.createTextNode(r.cuisine));
        const popup = new maplibregl.Popup({offset: 25}).setDOMContent(content);
        new maplibregl.Marker({color: markerColor(r.rating)})
            .setLngLat([r.longitude, r.latitude])
            .setPopup(popup)
            .addTo(map);
    });
})();
</script>

{% if is_htmx %}
<input type="hidden" name="sort" id="sort-input" value="{{ current_sort_param }}" hx-swap-oob="true">
<input type="hidden" name="view" id="view-input" value="map" hx-swap-oob="true">
{% endif %}
